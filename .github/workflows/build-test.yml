name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: ilammy/setup-nasm@v1
    - name: Verify NASM installation
      run: nasm --version
    - uses: actions/checkout@v4
    - name: configure
      run: cmake . -DE2EMU_TEST=ON
    - name: make
      run: make
    - name: make check
      run: make check
